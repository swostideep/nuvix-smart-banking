line-length = 96
target-version = "py312"

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "DJ",   # flake8-django
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function calls in defaults are idiomatic in DRF field definitions
    "RUF012",  # Django class attributes are not ClassVar by convention
]

[lint.per-file-ignores]
# Migrations are generated; settings modules use star imports by design.
"*/migrations/*" = ["E501", "RUF012", "I001"]
"config/settings/*" = ["F403", "F405"]
"*/tests/*" = ["S101"]

[lint.isort]
known-first-party = ["nuvix", "config"]
